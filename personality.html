<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="personality.css">
</head>
<body>
    <h1>Waffle Personality</h1>
    <h3>Discover your waffle alter ego</h3>
    <section>
    <p class = "question">What is your favorite waffle topping?</p>
    <label for="waffle-topping-strawberry"><input type="radio" id = "waffle-topping-strawberry" name = 'topping' value = "strawberry"> Strawberries</label>
    <label for="waffle-topping-chocolate"><input type="radio"  id = "waffle-topping-chocolate" name = 'topping' value="chocolate"> Chocolate</label>
    <label for="waffle-topping-blueberries"><input type="radio"  id = "waffle-topping-blueberries" name = 'topping' value="blueberries"> Blueberries</label>
    <label for="waffle-topping-butter"><input type="radio"  id = "waffle-topping-butter" name = 'topping' value="butter"> Butter</label>
    <p class = "question">How crispy do you like your waffle?</p>
    <label for="waffle-crispy-super"><input type="radio" id = "waffle-crispy-super" name = 'crispy' value="super-crispy"> Super Crispy</label>
    <label for="waffle-crispy-crispy"><input type="radio"  id = "waffle-crispy-crispy" name = 'crispy' value="crispy-fluffy">Crispy outside, fluffy inside</label>
    <label for="waffle-crispy-soft"><input type="radio"  id = "waffle-crispy-soft" name = 'crispy' value="soft">Soft and fluffy</label>
    <p class = "question">What sauce would you choose?</p>
    <label for="waffle-sauce-Maple"><input type="radio" id = "waffle-sauce-Maple" name = 'sauce' value="maple">Maple Syrup</label>
    <label for="waffle-sauce-Chocolate"><input type="radio"  id = "waffle-sauce-Chocolate" name = 'sauce' value="chocolate">Chocolate Sauce</label>
    <label for="waffle-sauce-Caramel"><input type="radio"  id = "waffle-sauce-Caramel" name = 'sauce' value="caramel">Caramel</label>
    <label for="waffle-sauce-Nosauce"><input type="radio"  id = "waffle-sauce-Nosauce" name = 'sauce' value="none">No Sauce</label></section>
    <button id = "reveal-personality">Reveal My Waffle Personality</button>
    <p id = "result"></p>
    <script src="script.js"></script>
</body>
</html>
